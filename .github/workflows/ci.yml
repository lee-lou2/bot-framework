name: Contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services: &test-services
      postgres:
        image: postgres:16@sha256:820b1558a744efeda508506fd85bff573cec8b6941ff4790ef4884a526dd6e86 # 16.16
        env:
          POSTGRES_DB: bot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: &test-env
      BOT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55432/bot_test
      BOT_TEST_REQUIRE_DB: '1'
      BOT_REQUIRE_NODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1 PyYAML==6.0.2
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          cargo --version
      - name: Install pinned release tools
        run: |
          cargo install --locked --version 0.21.0 cargo-deny
          gitleaks_image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          container_id=$(docker create "$gitleaks_image")
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/usr/bin/gitleaks" "$RUNNER_TEMP/gitleaks"
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/gitleaks" version | sed 's/^v//')" = "8.30.1"
          test "$(cargo-deny --version)" = "cargo-deny 0.21.0"
      - name: Check the test database
        run: psql "$BOT_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "SELECT 1"
      - name: Run public release checks
        run: scripts/release-check.sh --strict --only 'fmt clippy test contracts deny secrets-tree secrets-history selftest'

  tool-sandbox:
    name: Linux tool sandbox
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services: *test-services
    env: *test-env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          cargo --version
      - name: Install the tool sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends 'bubblewrap=0.6.1-*' 'socat=1.7.4.1-*' 'ripgrep=13.0.0-*'
          bwrap --version
          socat -V | sed -n '2p'
          rg --version | sed -n '1p'
          npm install --global --ignore-scripts --no-audit --no-fund @anthropic-ai/sandbox-runtime@0.0.83
      - name: Exercise real sandbox isolation
        env:
          BOT_SRT_CANARY: required
        run: |
          srt_bin="$(command -v srt)"
          BOT_SRT_BIN="$srt_bin" cargo test --locked -p bot-broker --features testing --test srt_canary -- --test-threads=1
      - name: Exercise the personal assistant and its cron trigger
        run: |
          srt --version
          python3 --version
          psql "$BOT_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "SELECT 1"
          cargo test --locked -p bot-cli --test split_roles runs_personal_demo -- --ignored --exact
