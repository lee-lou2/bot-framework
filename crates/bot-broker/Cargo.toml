[package]
name = "bot-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test doubles (ledger, catalog, runner, sandbox) shared by other crates; omitted from release builds.
testing = []

[dependencies]
base64.workspace = true
bot-core.workspace = true
hmac.workspace = true
serde.workspace = true
# float_roundtrip ensures deterministic float parsing so canonical JSON and hashes match across implementations.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
