[package]
name = "bot-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test doubles (ledger, catalog, runner, sandbox) shared by other crates; omitted from release builds.
testing = []

[dependencies]
base64.workspace = true
bot-core.workspace = true
hmac.workspace = true
serde.workspace = true
# Workspace serde_json enables float_roundtrip for deterministic canonical JSON and hashes.
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
