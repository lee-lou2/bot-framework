<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>bot Admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/ui/app.css">
  <link rel="stylesheet" href="/ui/map.css">
  <link rel="stylesheet" href="/ui/views.css">
  <link rel="stylesheet" href="/ui/runs.css">
  <link rel="stylesheet" href="/ui/decide.css">
  <link rel="stylesheet" href="/ui/preapprovals.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span id="mark" class="mark"></span><h1>bot Admin</h1></div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Views">
      <span id="tab-ink" class="tab-ink" aria-hidden="true"></span>
    </nav>
    <div class="controls">
      <span id="who" class="who" title="Signed-in principal"></span>
      <label class="field"><span class="lab">Profile</span><span class="sel"><select id="profile"><option value="">All</option></select><span id="sel-ic" class="sel-ic"></span></span></label>
      <label class="switch"><input type="checkbox" id="auto" checked><span class="track" aria-hidden="true"></span><span class="txt">Refresh every 5s</span></label>
      <span id="stamp" class="stamp"></span>
    </div>
  </header>
  <div id="notice" class="notice" role="status"></div>
  <main id="main">
    <noscript><div class="boot"><p>JavaScript must be enabled to use this page.</p></div></noscript>
    <div id="boot" class="boot" role="status"><div class="skeleton"><p class="sr">Loading…</p><div class="sk-bar"></div><div class="sk-bar"></div><div class="sk-bar short"></div></div><p class="boot-hint">If loading appears stuck, verify the URL does not include embedded credentials and reopen in a minute.</p></div>
    <section id="view-structure" role="tabpanel" aria-labelledby="tab-structure" class="view view-map" hidden>
      <h2 class="sr">Structure</h2>
      <div id="bar" class="mapbar">
        <label class="search"><span id="search-ic" class="search-ic"></span><input type="search" id="query" placeholder="Search name or summary" aria-label="Search name or summary" autocomplete="off" spellcheck="false"><span id="hits" class="hits" aria-live="polite"></span></label>
        <div id="kinds" class="legend" role="group" aria-label="Kind filter"></div>
        <button type="button" id="fit" class="btn" aria-label="Fit view"><span id="fit-ic" class="btn-ic"></span><span class="btn-t">Fit view</span></button>
      </div>
      <div id="map" class="viewport" tabindex="0" role="region" aria-label="Structure map. Drag to pan and use Ctrl or Command with scroll wheel to zoom">
        <div id="stage" class="stage"></div>
      </div>
      <p id="maphint" class="maphint">Click a node for details and links · Drag to pan · Ctrl/⌘ + wheel to zoom</p>
      <div id="dock" class="dock" role="group" aria-label="Shared resources"></div>
      <div id="zoom" class="zoom" role="group" aria-label="Zoom">
        <button type="button" id="zin" aria-label="Zoom in"></button>
        <button type="button" id="zout" aria-label="Zoom out"></button>
      </div>
      <aside id="detail" class="panel" aria-label="Details" aria-live="polite"></aside>
    </section>
    <section id="view-runs" role="tabpanel" aria-labelledby="tab-runs" class="view page" hidden></section>
    <section id="view-decide" role="tabpanel" aria-labelledby="tab-decide" class="view page" hidden></section>
    <section id="view-preapprovals" role="tabpanel" aria-labelledby="tab-preapprovals" class="view page" hidden></section>
    <section id="view-access" role="tabpanel" aria-labelledby="tab-access" class="view page" hidden></section>
    <section id="view-audit" role="tabpanel" aria-labelledby="tab-audit" class="view page" hidden></section>
    <section id="view-status" role="tabpanel" aria-labelledby="tab-status" class="view page" hidden></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/ui/dom.js"></script>
  <script src="/ui/api.js"></script>
  <script src="/ui/labels.js"></script>
  <script src="/ui/holdpin.js"></script>
  <script src="/ui/camera.js"></script>
  <script src="/ui/layout.js"></script>
  <script src="/ui/panel.js"></script>
  <script src="/ui/needs.js"></script>
  <script src="/ui/map.js"></script>
  <script src="/ui/store.js"></script>
  <script src="/ui/structure.js"></script>
  <script src="/ui/runctl.js"></script>
  <script src="/ui/runs.js"></script>
  <script src="/ui/decide.js"></script>
  <script src="/ui/preapproval.js"></script>
  <script src="/ui/preapprovals.js"></script>
  <script src="/ui/access.js"></script>
  <script src="/ui/audit.js"></script>
  <script src="/ui/status.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
