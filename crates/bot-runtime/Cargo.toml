[package]
name = "bot-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bot-core.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
# Upstream transport for direct API model runner (`model::api`): disables redirects, retries, and connection pooling.
reqwest.workspace = true
# Safe `openat`-based session file access confined to the scratch directory without unsafe code.
rustix.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Apple `container` client subprocess for the model VM adapter.
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

[dev-dependencies]
# Worker/scheduler integration tests against PostgreSQL and BrokerService with fake runners.
bot-broker = { workspace = true, features = ["testing"] }
bot-profile.workspace = true
bot-store.workspace = true
sqlx.workspace = true
