[package]
name = "bot-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Synthetic profile builders and in-memory test doubles for cross-crate tests; excluded from production builds.
testing = []

[dependencies]
bot-core.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
hmac.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
bot-gateway = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# Fake clock (`start_paused`) for deterministic wait and deadline tests.
tokio = { workspace = true, features = ["test-util"] }
