<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-labelledby="t-pt-l d-pt-l">
  <title id="t-pt-l">Bot Framework 모델 실행 2경로 비교</title>
  <desc id="d-pt-l">기본 권장인 직접 API 경로(anthropic-api, openai-api)와 격리 파일 읽기가 필요할 때 쓰는 일회용 Apple container VM 경로(claude-cli)가 모두 비밀 노출을 막고 Broker::call 관문을 경유하는 비교 구조.</desc>
  <style>
    .bg { fill: #f5f5f5; }
    .frame { fill: #f5f5f5; stroke: #cfd5dd; stroke-width: 1; }
    .hdr-bg { fill: #f5f5f5; }
    .ftr-bg { fill: #f5f5f5; }
    .hdr-rule { stroke: rgba(45,49,66,0.14); stroke-width: 1; }
    .dot { fill: rgba(45,49,66,0.11); }
    .zone { fill: rgba(45,49,66,0.025); stroke: rgba(45,49,66,0.18); stroke-width: 0.9; }
    .zone-dash { fill: rgba(45,49,66,0.025); stroke: #4f5d75; stroke-width: 0.9; stroke-dasharray: 5,3; }
    .node { fill: #f5f5f5; stroke: #2d3142; stroke-width: 1.1; }
    .node-soft { fill: #f5f5f5; stroke: #4f5d75; stroke-width: 1; }
    .node-dash { fill: #f5f5f5; stroke: #2d3142; stroke-width: 1.1; stroke-dasharray: 5,3; }
    .node-focal { fill: rgba(191,69,32,0.075); stroke: #bf4520; stroke-width: 1.5; }
    .node-link { fill: rgba(46,90,168,0.07); stroke: #2e5aa8; stroke-width: 1.1; }
    .div { stroke: rgba(45,49,66,0.14); stroke-width: 0.9; }
    .div-acc { stroke: rgba(191,69,32,0.28); stroke-width: 0.9; }
    .lbl-bg { fill: #f5f5f5; }
    .h-eye { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; fill: #bf4520; }
    .h-title { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #2d3142; }
    .h-sub { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 11.5px; fill: #4f5d75; }
    .eye { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.10em; fill: #5a6580; }
    .eye-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.10em; fill: #bf4520; }
    .eye-lnk { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.10em; fill: #2e5aa8; }
    .ttl { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #2d3142; }
    .ttl-sm { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #2d3142; }
    .ttl-acc { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #bf4520; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 10px; fill: #4f5d75; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8.8px; fill: #4f5d75; }
    .mono-ink { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 9.2px; font-weight: 500; fill: #2d3142; }
    .zlbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.12em; fill: #5a6580; }
    .zlbl-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.12em; fill: #bf4520; }
    .edge { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
    .edge-dash { fill: none; stroke: #4f5d75; stroke-width: 1; stroke-dasharray: 4,3; }
    .edge-acc { fill: none; stroke: #bf4520; stroke-width: 1.5; }
    .edge-lnk { fill: none; stroke: #2e5aa8; stroke-width: 1.3; }
    .elbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 500; fill: #4f5d75; }
    .elbl-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; fill: #bf4520; }
    .elbl-lnk { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; fill: #2e5aa8; }
    .ar-m { fill: #4f5d75; }
    .ar-a { fill: #bf4520; }
    .ar-l { fill: #2e5aa8; }
    .bar { stroke: #bfc0c0; stroke-width: 2; }
    .bar-acc { stroke: #bf4520; stroke-width: 2; }
    .fk { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.08em; fill: #5a6580; }
    .fk-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.08em; fill: #bf4520; }
    .fv { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 10px; fill: #2d3142; }
  </style>
  <defs>
    <clipPath id="clip-pt-l"><rect x="0.5" y="0.5" width="1119" height="659" rx="10"/></clipPath>
    <pattern id="dots-pt-l" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.85" class="dot"/>
    </pattern>
    <marker id="ar-m-pt-l" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" class="ar-m"/>
    </marker>
    <marker id="ar-mr-pt-l" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto">
      <polygon points="7 0, 0 3, 7 6" class="ar-m"/>
    </marker>
    <marker id="ar-a-pt-l" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" class="ar-a"/>
    </marker>
    <marker id="ar-ar-pt-l" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto">
      <polygon points="7 0, 0 3, 7 6" class="ar-a"/>
    </marker>
    <marker id="ar-l-pt-l" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" class="ar-l"/>
    </marker>
    <marker id="ar-lr-pt-l" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto">
      <polygon points="7 0, 0 3, 7 6" class="ar-l"/>
    </marker>
  </defs>
  <g clip-path="url(#clip-pt-l)">
    <rect width="1120" height="660" class="bg"/>
    <rect x="0" y="76" width="1120" height="504" fill="url(#dots-pt-l)" opacity="0.6"/>
    <!-- Header -->
    <text x="24" y="28" class="h-eye">EXECUTION MODEL · SECURITY ISOLATION · TWO PATHS</text>
    <text x="24" y="51" class="h-title">모델 실행 2경로 비교 (직접 API vs 일회용 VM)</text>
    <text x="24" y="67" class="h-sub">모델은 어느 경로에서도 호스트 파일·셸이나 서비스 키에 닿지 못하며, 모든 도구 호출은 Broker::call을 경유</text>
    <line x1="0" y1="76" x2="1120" y2="76" class="hdr-rule"/>

    <g transform="translate(0,68)">
      <!-- ZONES -->
      <rect x="24" y="28" width="1072" height="196" rx="8" class="zone"/>
      <rect x="44" y="22" width="424" height="14" rx="2" class="lbl-bg"/>
      <text x="52" y="32" class="zlbl">PATH A · DIRECT API (anthropic-api / openai-api · 기본 권장)</text>

      <rect x="24" y="256" width="1072" height="236" rx="8" class="zone"/>
      <rect x="44" y="250" width="448" height="14" rx="2" class="lbl-bg"/>
      <text x="52" y="260" class="zlbl-acc">PATH B · CLAUDE-CLI IN DISPOSABLE VM (macOS Apple container)</text>

      <!-- PATH A ARROWS -->
      <line x1="340" y1="128" x2="264" y2="128" class="edge-lnk" marker-start="url(#ar-lr-pt-l)" marker-end="url(#ar-l-pt-l)"/>
      <line x1="564" y1="128" x2="640" y2="128" class="edge-acc" marker-end="url(#ar-a-pt-l)"/>
      <line x1="836" y1="128" x2="904" y2="128" class="edge" marker-end="url(#ar-m-pt-l)"/>

      <rect x="268" y="106" width="68" height="14" rx="2" class="lbl-bg"/>
      <text x="302" y="116" text-anchor="middle" class="elbl-lnk">HTTPS + 키</text>
      <rect x="268" y="136" width="68" height="13" rx="2" class="lbl-bg"/>
      <text x="302" y="146" text-anchor="middle" class="elbl">글 · 도구 계획</text>
      <rect x="568" y="106" width="68" height="14" rx="2" class="lbl-bg"/>
      <text x="602" y="116" text-anchor="middle" class="elbl-acc">Broker::call</text>
      <rect x="844" y="106" width="52" height="14" rx="2" class="lbl-bg"/>
      <text x="870" y="116" text-anchor="middle" class="elbl">stdio/HTTP</text>

      <!-- PATH B ARROWS -->
      <line x1="564" y1="352" x2="640" y2="352" class="edge-acc" marker-end="url(#ar-a-pt-l)"/>
      <path d="M 738,416 V 452 Q 738,460 730,460 H 164 Q 156,460 156,452 V 408" class="edge-lnk" marker-end="url(#ar-l-pt-l)"/>
      <line x1="836" y1="352" x2="904" y2="352" class="edge" marker-end="url(#ar-m-pt-l)"/>

      <rect x="568" y="330" width="68" height="14" rx="2" class="lbl-bg"/>
      <text x="602" y="340" text-anchor="middle" class="elbl-acc">릴레이 전용</text>
      <rect x="568" y="360" width="68" height="13" rx="2" class="lbl-bg"/>
      <text x="602" y="370" text-anchor="middle" class="elbl">세션 토큰</text>
      <rect x="344" y="453" width="236" height="14" rx="2" class="lbl-bg"/>
      <text x="462" y="463" text-anchor="middle" class="elbl-lnk">브로커 프록시만 공급자 키 주입 → 상류 HTTPS</text>
      <rect x="844" y="330" width="52" height="14" rx="2" class="lbl-bg"/>
      <text x="870" y="340" text-anchor="middle" class="elbl">stdio/HTTP</text>

      <!-- PATH A NODES -->
      <g id="pa-api">
        <rect x="48" y="72" width="216" height="116" rx="6" class="node-link"/>
        <text x="60" y="92" class="eye-lnk">UPSTREAM ENDPOINT</text>
        <text x="60" y="114" class="ttl-sm">Model Provider API</text>
        <line x1="60" y1="124" x2="252" y2="124" class="div"/>
        <text x="60" y="142" class="mono">/v1/messages (Anthropic)</text>
        <text x="60" y="158" class="mono">/chat/completions (OpenAI)</text>
        <text x="60" y="174" class="sub">HTTPS 강제 (loopback만 HTTP)</text>
      </g>
      <g id="pa-worker">
        <rect x="340" y="72" width="224" height="116" rx="6" class="node"/>
        <text x="352" y="92" class="eye">TRUSTED HOST · Linux / macOS</text>
        <text x="352" y="114" class="ttl-sm">Worker (직접 API 실행기)</text>
        <line x1="352" y1="124" x2="552" y2="124" class="div"/>
        <text x="352" y="142" class="sub">VM 없이 대화만 전송 · 셸/파일 없음</text>
        <text x="352" y="158" class="sub">전송 직전 키 주입 · 판본 2중 검증</text>
        <text x="352" y="174" class="mono">응답 키 노출 → secret_in_response</text>
      </g>
      <g id="pa-broker">
        <rect x="640" y="72" width="196" height="116" rx="6" class="node-focal"/>
        <text x="652" y="92" class="eye-acc">SINGLE GATE</text>
        <text x="652" y="114" class="ttl-acc">Broker</text>
        <line x1="652" y1="124" x2="824" y2="124" class="div-acc"/>
        <text x="652" y="142" class="sub">계획 호출 인가 · 승인 · 감사</text>
        <text x="652" y="158" class="sub">승인 대기 후 동일 계획 재개</text>
        <text x="652" y="174" class="mono">호출 ID 멱등 · 원장 기록</text>
      </g>
      <g id="pa-tools">
        <rect x="904" y="72" width="168" height="116" rx="6" class="node"/>
        <text x="916" y="92" class="eye">TOOLS</text>
        <text x="916" y="114" class="ttl-sm">MCP · 내장 도구</text>
        <line x1="916" y1="124" x2="1060" y2="124" class="div"/>
        <text x="916" y="142" class="sub">srt 샌드박스 · 원격 MCP</text>
        <text x="916" y="158" class="mono">memory · schedule</text>
        <text x="916" y="174" class="mono">delegate (read 불가)</text>
      </g>

      <!-- PATH B NODES -->
      <g id="pb-api">
        <rect x="48" y="296" width="216" height="112" rx="6" class="node-link"/>
        <text x="60" y="316" class="eye-lnk">UPSTREAM ENDPOINT</text>
        <text x="60" y="338" class="ttl-sm">Anthropic API</text>
        <line x1="60" y1="348" x2="252" y2="348" class="div"/>
        <text x="60" y="366" class="sub">VM에서 직접 접근 불가</text>
        <text x="60" y="382" class="mono">호스트 브로커 프록시만 연결</text>
        <text x="60" y="398" class="mono">GuardedUpstream 판본 확인</text>
      </g>
      <g id="pb-vm">
        <rect x="340" y="288" width="224" height="128" rx="6" class="node-dash"/>
        <text x="352" y="308" class="eye-acc">UNTRUSTED · DISPOSABLE VM</text>
        <text x="352" y="330" class="ttl-sm">Claude CLI in VM</text>
        <line x1="352" y1="340" x2="552" y2="340" class="div"/>
        <text x="352" y="358" class="sub">실행마다 새 VM · 서비스 키 없음</text>
        <text x="352" y="374" class="mono">bot-init 방화벽 + 권한 강등</text>
        <text x="352" y="390" class="mono">읽기전용 /bot/AGENTS.md</text>
        <text x="352" y="406" class="mono">격리 read + --strict-mcp-config</text>
      </g>
      <g id="pb-broker">
        <rect x="640" y="288" width="196" height="128" rx="6" class="node-focal"/>
        <text x="652" y="308" class="eye-acc">RELAY + PROXY + GATE</text>
        <text x="652" y="330" class="ttl-acc">Broker</text>
        <line x1="652" y1="340" x2="824" y2="340" class="div-acc"/>
        <text x="652" y="358" class="sub">세션 토큰(claim) 검증</text>
        <text x="652" y="376" class="mono">POST /v1/messages 대행</text>
        <text x="652" y="394" class="mono">POST /mcp → Broker::call</text>
      </g>
      <g id="pb-tools">
        <rect x="904" y="296" width="168" height="112" rx="6" class="node"/>
        <text x="916" y="316" class="eye">TOOLS</text>
        <text x="916" y="338" class="ttl-sm">MCP · 내장 도구</text>
        <line x1="916" y1="348" x2="1060" y2="348" class="div"/>
        <text x="916" y="366" class="sub">srt 샌드박스 · 원격 MCP</text>
        <text x="916" y="382" class="mono">memory · schedule</text>
        <text x="916" y="398" class="mono">delegate + 격리 read</text>
      </g>
    </g>

    <!-- Footer Ledger -->
  <line x1="1" y1="580" x2="1119" y2="580" class="hdr-rule"/>
  <line x1="24" y1="596" x2="24" y2="644" class="bar"/>
  <text x="34" y="606" class="fk">선택 기준</text>
  <text x="34" y="625" class="fv">일반 대화·도구 호출은 직접 API 권장</text>
  <text x="34" y="641" class="fv">작업 공간 파일 read 필요 시 VM 사용</text>
  <line x1="296" y1="596" x2="296" y2="644" class="bar-acc"/>
  <text x="306" y="606" class="fk-acc">공통 브로커 관문</text>
  <text x="306" y="625" class="fv">두 경로 모두 도구 인가·사람 승인·</text>
  <text x="306" y="641" class="fv">효과 원장·감사는 Broker::call 공유</text>
  <line x1="568" y1="596" x2="568" y2="644" class="bar"/>
  <text x="578" y="606" class="fk">닻 VM (ANCHOR)</text>
  <text x="578" y="625" class="fv">claude-cli에서 호스트 전용망 유지</text>
  <text x="578" y="641" class="fv">신뢰 init에 릴레이 IP:Port만 전달</text>
  <line x1="840" y1="596" x2="840" y2="644" class="bar"/>
  <text x="850" y="606" class="fk">구판 차단 (STALE)</text>
  <text x="850" y="625" class="fv">활성 판본 변경 시 구판 워커는 키 읽기</text>
  <text x="850" y="641" class="fv">및 전송을 즉시 중단하고 큐로 반환</text>
  </g>
  <rect x="0.5" y="0.5" width="1119" height="659" rx="10" fill="none" stroke="#cfd5dd" stroke-width="1"/>
</svg>
