<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-labelledby="t-pt-d d-pt-d">
  <title id="t-pt-d">Bot Framework Model Execution Paths Comparison</title>
  <desc id="d-pt-d">Compares the recommended Direct API path (anthropic-api, openai-api) and the disposable Apple container VM path (claude-cli) for isolated file reads — both block secret exposure and route every tool call through Broker::call.</desc>
  <style>
    .bg { fill: #1c212c; }
    .frame { fill: #1c212c; stroke: #343d50; stroke-width: 1; }
    .hdr-bg { fill: #1c212c; }
    .ftr-bg { fill: #1c212c; }
    .hdr-rule { stroke: rgba(245,245,245,0.13); stroke-width: 1; }
    .dot { fill: rgba(245,245,245,0.10); }
    .zone { fill: rgba(245,245,245,0.025); stroke: rgba(245,245,245,0.17); stroke-width: 0.9; }
    .zone-dash { fill: rgba(245,245,245,0.025); stroke: #c4c8d4; stroke-width: 0.9; stroke-dasharray: 5,3; }
    .node { fill: #1c212c; stroke: #f2f3f5; stroke-width: 1.1; }
    .node-soft { fill: #1c212c; stroke: #c4c8d4; stroke-width: 1; }
    .node-dash { fill: #1c212c; stroke: #f2f3f5; stroke-width: 1.1; stroke-dasharray: 5,3; }
    .node-focal { fill: rgba(240,138,89,0.11); stroke: #f08a59; stroke-width: 1.5; }
    .node-link { fill: rgba(124,166,232,0.10); stroke: #7ca6e8; stroke-width: 1.1; }
    .div { stroke: rgba(245,245,245,0.13); stroke-width: 0.9; }
    .div-acc { stroke: rgba(240,138,89,0.32); stroke-width: 0.9; }
    .lbl-bg { fill: #1c212c; }
    .h-eye { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; fill: #f08a59; }
    .h-title { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #f2f3f5; }
    .h-sub { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 11.5px; fill: #c4c8d4; }
    .eye { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.10em; fill: #9aa4ba; }
    .eye-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.10em; fill: #f08a59; }
    .eye-lnk { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.10em; fill: #7ca6e8; }
    .ttl { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #f2f3f5; }
    .ttl-sm { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #f2f3f5; }
    .ttl-acc { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #f08a59; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 10px; fill: #c4c8d4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8.8px; fill: #c4c8d4; }
    .mono-ink { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 9.2px; font-weight: 500; fill: #f2f3f5; }
    .zlbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.12em; fill: #9aa4ba; }
    .zlbl-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.12em; fill: #f08a59; }
    .edge { fill: none; stroke: #c4c8d4; stroke-width: 1.2; }
    .edge-dash { fill: none; stroke: #c4c8d4; stroke-width: 1; stroke-dasharray: 4,3; }
    .edge-acc { fill: none; stroke: #f08a59; stroke-width: 1.5; }
    .edge-lnk { fill: none; stroke: #7ca6e8; stroke-width: 1.3; }
    .elbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 500; fill: #c4c8d4; }
    .elbl-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; fill: #f08a59; }
    .elbl-lnk { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; fill: #7ca6e8; }
    .ar-m { fill: #c4c8d4; }
    .ar-a { fill: #f08a59; }
    .ar-l { fill: #7ca6e8; }
    .bar { stroke: rgba(191,192,192,0.30); stroke-width: 2; }
    .bar-acc { stroke: #f08a59; stroke-width: 2; }
    .fk { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.08em; fill: #9aa4ba; }
    .fk-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.08em; fill: #f08a59; }
    .fv { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 10px; fill: #f2f3f5; }
  </style>
  <defs>
    <clipPath id="clip-pt-d"><rect x="0.5" y="0.5" width="1119" height="659" rx="10"/></clipPath>
    <pattern id="dots-pt-d" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.85" class="dot"/>
    </pattern>
    <marker id="ar-m-pt-d" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" class="ar-m"/>
    </marker>
    <marker id="ar-mr-pt-d" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto">
      <polygon points="7 0, 0 3, 7 6" class="ar-m"/>
    </marker>
    <marker id="ar-a-pt-d" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" class="ar-a"/>
    </marker>
    <marker id="ar-ar-pt-d" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto">
      <polygon points="7 0, 0 3, 7 6" class="ar-a"/>
    </marker>
    <marker id="ar-l-pt-d" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" class="ar-l"/>
    </marker>
    <marker id="ar-lr-pt-d" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto">
      <polygon points="7 0, 0 3, 7 6" class="ar-l"/>
    </marker>
  </defs>
  <g clip-path="url(#clip-pt-d)">
    <rect width="1120" height="660" class="bg"/>
    <rect x="0" y="76" width="1120" height="504" fill="url(#dots-pt-d)" opacity="0.6"/>
    <!-- Header -->
    <text x="24" y="28" class="h-eye">EXECUTION MODEL · SECURITY ISOLATION · TWO PATHS</text>
    <text x="24" y="51" class="h-title">Model Execution Paths: Direct API vs Disposable VM</text>
    <text x="24" y="67" class="h-sub">Neither path exposes host files, shell, or service keys to models — every tool call passes through Broker::call</text>
    <line x1="0" y1="76" x2="1120" y2="76" class="hdr-rule"/>

    <g transform="translate(0,68)">
      <!-- ZONES -->
      <rect x="24" y="28" width="1072" height="196" rx="8" class="zone"/>
      <rect x="44" y="22" width="424" height="14" rx="2" class="lbl-bg"/>
      <text x="52" y="32" class="zlbl">PATH A · DIRECT API (anthropic-api / openai-api · RECOMMENDED)</text>

      <rect x="24" y="256" width="1072" height="236" rx="8" class="zone"/>
      <rect x="44" y="250" width="448" height="14" rx="2" class="lbl-bg"/>
      <text x="52" y="260" class="zlbl-acc">PATH B · CLAUDE-CLI IN DISPOSABLE VM (macOS Apple container)</text>

      <!-- PATH A ARROWS -->
      <line x1="340" y1="128" x2="264" y2="128" class="edge-lnk" marker-start="url(#ar-lr-pt-d)" marker-end="url(#ar-l-pt-d)"/>
      <line x1="564" y1="128" x2="640" y2="128" class="edge-acc" marker-end="url(#ar-a-pt-d)"/>
      <line x1="836" y1="128" x2="904" y2="128" class="edge" marker-end="url(#ar-m-pt-d)"/>

      <rect x="268" y="106" width="68" height="14" rx="2" class="lbl-bg"/>
      <text x="302" y="116" text-anchor="middle" class="elbl-lnk">HTTPS + key</text>
      <rect x="268" y="136" width="68" height="13" rx="2" class="lbl-bg"/>
      <text x="302" y="146" text-anchor="middle" class="elbl">Text · Plan</text>
      <rect x="568" y="106" width="68" height="14" rx="2" class="lbl-bg"/>
      <text x="602" y="116" text-anchor="middle" class="elbl-acc">Broker::call</text>
      <rect x="844" y="106" width="52" height="14" rx="2" class="lbl-bg"/>
      <text x="870" y="116" text-anchor="middle" class="elbl">stdio/HTTP</text>

      <!-- PATH B ARROWS -->
      <line x1="564" y1="352" x2="640" y2="352" class="edge-acc" marker-end="url(#ar-a-pt-d)"/>
      <path d="M 738,416 V 452 Q 738,460 730,460 H 164 Q 156,460 156,452 V 408" class="edge-lnk" marker-end="url(#ar-l-pt-d)"/>
      <line x1="836" y1="352" x2="904" y2="352" class="edge" marker-end="url(#ar-m-pt-d)"/>

      <rect x="568" y="330" width="68" height="14" rx="2" class="lbl-bg"/>
      <text x="602" y="340" text-anchor="middle" class="elbl-acc">Relay only</text>
      <rect x="568" y="360" width="68" height="13" rx="2" class="lbl-bg"/>
      <text x="602" y="370" text-anchor="middle" class="elbl">Token only</text>
      <rect x="344" y="453" width="236" height="14" rx="2" class="lbl-bg"/>
      <text x="462" y="463" text-anchor="middle" class="elbl-lnk">Only broker proxy injects provider key → HTTPS</text>
      <rect x="844" y="330" width="52" height="14" rx="2" class="lbl-bg"/>
      <text x="870" y="340" text-anchor="middle" class="elbl">stdio/HTTP</text>

      <!-- PATH A NODES -->
      <g id="pa-api">
        <rect x="48" y="72" width="216" height="116" rx="6" class="node-link"/>
        <text x="60" y="92" class="eye-lnk">UPSTREAM ENDPOINT</text>
        <text x="60" y="114" class="ttl-sm">Model Provider API</text>
        <line x1="60" y1="124" x2="252" y2="124" class="div"/>
        <text x="60" y="142" class="mono">/v1/messages (Anthropic)</text>
        <text x="60" y="158" class="mono">/chat/completions (OpenAI)</text>
        <text x="60" y="174" class="sub">HTTPS required (loopback HTTP ok)</text>
      </g>
      <g id="pa-worker">
        <rect x="340" y="72" width="224" height="116" rx="6" class="node"/>
        <text x="352" y="92" class="eye">TRUSTED HOST · Linux / macOS</text>
        <text x="352" y="114" class="ttl-sm">Worker (Direct API Runner)</text>
        <line x1="352" y1="124" x2="552" y2="124" class="div"/>
        <text x="352" y="142" class="sub">No VM · Messages only · No shell/FS</text>
        <text x="352" y="158" class="sub">Header key on send · 2x rev check</text>
        <text x="352" y="174" class="mono">Key leak → secret_in_response</text>
      </g>
      <g id="pa-broker">
        <rect x="640" y="72" width="196" height="116" rx="6" class="node-focal"/>
        <text x="652" y="92" class="eye-acc">SINGLE GATE</text>
        <text x="652" y="114" class="ttl-acc">Broker</text>
        <line x1="652" y1="124" x2="824" y2="124" class="div-acc"/>
        <text x="652" y="142" class="sub">Auth · Approvals · Audit</text>
        <text x="652" y="158" class="sub">Resumes exact plan on approval</text>
        <text x="652" y="174" class="mono">Idempotent ID · Call ledger</text>
      </g>
      <g id="pa-tools">
        <rect x="904" y="72" width="168" height="116" rx="6" class="node"/>
        <text x="916" y="92" class="eye">TOOLS</text>
        <text x="916" y="114" class="ttl-sm">MCP · Built-ins</text>
        <line x1="916" y1="124" x2="1060" y2="124" class="div"/>
        <text x="916" y="142" class="sub">srt sandbox · Remote MCP</text>
        <text x="916" y="158" class="mono">memory · schedule</text>
        <text x="916" y="174" class="mono">delegate (no read)</text>
      </g>

      <!-- PATH B NODES -->
      <g id="pb-api">
        <rect x="48" y="296" width="216" height="112" rx="6" class="node-link"/>
        <text x="60" y="316" class="eye-lnk">UPSTREAM ENDPOINT</text>
        <text x="60" y="338" class="ttl-sm">Anthropic API</text>
        <line x1="60" y1="348" x2="252" y2="348" class="div"/>
        <text x="60" y="366" class="sub">Unreachable directly from VM</text>
        <text x="60" y="382" class="mono">Broker proxy connects only</text>
        <text x="60" y="398" class="mono">GuardedUpstream rev check</text>
      </g>
      <g id="pb-vm">
        <rect x="340" y="288" width="224" height="128" rx="6" class="node-dash"/>
        <text x="352" y="308" class="eye-acc">UNTRUSTED · DISPOSABLE VM</text>
        <text x="352" y="330" class="ttl-sm">Claude CLI in VM</text>
        <line x1="352" y1="340" x2="552" y2="340" class="div"/>
        <text x="352" y="358" class="sub">Fresh VM per run · Zero secrets</text>
        <text x="352" y="374" class="mono">bot-init firewall + drop privs</text>
        <text x="352" y="390" class="mono">Read-only /bot/AGENTS.md</text>
        <text x="352" y="406" class="mono">Isolated read · strict MCP cfg</text>
      </g>
      <g id="pb-broker">
        <rect x="640" y="288" width="196" height="128" rx="6" class="node-focal"/>
        <text x="652" y="308" class="eye-acc">RELAY + PROXY + GATE</text>
        <text x="652" y="330" class="ttl-acc">Broker</text>
        <line x1="652" y1="340" x2="824" y2="340" class="div-acc"/>
        <text x="652" y="358" class="sub">Verifies claim session token</text>
        <text x="652" y="376" class="mono">POST /v1/messages proxy</text>
        <text x="652" y="394" class="mono">POST /mcp → Broker::call</text>
      </g>
      <g id="pb-tools">
        <rect x="904" y="296" width="168" height="112" rx="6" class="node"/>
        <text x="916" y="316" class="eye">TOOLS</text>
        <text x="916" y="338" class="ttl-sm">MCP · Built-ins</text>
        <line x1="916" y1="348" x2="1060" y2="348" class="div"/>
        <text x="916" y="366" class="sub">srt sandbox · Remote MCP</text>
        <text x="916" y="382" class="mono">memory · schedule</text>
        <text x="916" y="398" class="mono">delegate + isolated read</text>
      </g>
    </g>

    <!-- Footer Ledger -->
  <line x1="1" y1="580" x2="1119" y2="580" class="hdr-rule"/>
  <line x1="24" y1="596" x2="24" y2="644" class="bar"/>
  <text x="34" y="606" class="fk">WHEN TO CHOOSE</text>
  <text x="34" y="625" class="fv">Use Direct API by default for chat &amp; tools</text>
  <text x="34" y="641" class="fv">Use Disposable VM when workspace read is needed</text>
  <line x1="296" y1="596" x2="296" y2="644" class="bar-acc"/>
  <text x="306" y="606" class="fk-acc">SHARED BROKER GATE</text>
  <text x="306" y="625" class="fv">Both paths share Broker::call for tool auth,</text>
  <text x="306" y="641" class="fv">human approvals, effect ledger, and audit</text>
  <line x1="568" y1="596" x2="568" y2="644" class="bar"/>
  <text x="578" y="606" class="fk">ANCHOR VM</text>
  <text x="578" y="625" class="fv">Holds host-only network for claude-cli</text>
  <text x="578" y="641" class="fv">Passes only relay IP:Port to trusted init</text>
  <line x1="840" y1="596" x2="840" y2="644" class="bar"/>
  <text x="850" y="606" class="fk">STALE WORKER GUARD</text>
  <text x="850" y="625" class="fv">On active-set change, stale workers abort</text>
  <text x="850" y="641" class="fv">key reads and sends, releasing to queue</text>
  </g>
  <rect x="0.5" y="0.5" width="1119" height="659" rx="10" fill="none" stroke="#343d50" stroke-width="1"/>
</svg>
