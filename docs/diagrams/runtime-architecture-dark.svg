<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 716" width="1120" height="716" role="img" aria-labelledby="t-rt-d d-rt-d">
  <title id="t-rt-d">Bot Framework 런타임 아키텍처 및 신뢰 경계</title>
  <desc id="d-rt-d">Gateway, Scheduler, Admin이 PostgreSQL(bot-store)에 요청과 승인을 기록하고, 신뢰 호스트의 Worker와 Broker(단일 인가 관문)가 모델 VM, 상류 모델 API, MCP 도구 샌드박스(srt), 원격 MCP 서버를 격리 실행하는 구조.</desc>
  <style>
