    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; font-size: 10px; fill: #c4c8d4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8.8px; fill: #c4c8d4; }
    .mono-ink { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 9.2px; font-weight: 500; fill: #f2f3f5; }
    .zlbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.12em; fill: #9aa4ba; }
    .zlbl-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.12em; fill: #f08a59; }
    .edge { fill: none; stroke: #c4c8d4; stroke-width: 1.2; }
    .edge-dash { fill: none; stroke: #c4c8d4; stroke-width: 1; stroke-dasharray: 4,3; }
    .edge-acc { fill: none; stroke: #f08a59; stroke-width: 1.5; }
    .edge-lnk { fill: none; stroke: #7ca6e8; stroke-width: 1.3; }
    .elbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 500; fill: #c4c8d4; }
    .elbl-acc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; fill: #f08a59; }
    .elbl-lnk { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 8px; font-weight: 600; fill: #7ca6e8; }
