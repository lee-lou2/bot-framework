  <g clip-path="url(#clip-rt-d)">
    <rect width="1120" height="716" class="bg"/>
    <rect x="0" y="76" width="1120" height="560" fill="url(#dots-rt-d)" opacity="0.6"/>
    <!-- Header -->
    <text x="24" y="28" class="h-eye">ARCHITECTURE · BOT FRAMEWORK · RUNTIME &amp; TRUST BOUNDARIES</text>
    <text x="24" y="51" class="h-title">Bot Framework 전체 런타임 아키텍처</text>
    <text x="24" y="67" class="h-sub">단일 바이너리(bot serve --role all)가 프로필을 읽어 DB에 먼저 커밋하고, 브로커 관문과 샌드박스 격리 아래 실행·회신하는 구조</text>
    <line x1="0" y1="76" x2="1120" y2="76" class="hdr-rule"/>

    <!-- Diagram canvas translated down by 68 -->
