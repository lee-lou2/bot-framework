version: 1
server: demo-agenda            # Alias of a server installed on the host
tools:
  - id: list                   # Tool ID is agenda.list (<skill>.<tool>)
    class: read                # Read tools run without approval
    scopes: [calendar.read]    # Requires this scope on the active run
    env: [TEAM_TIMEZONE]       # Forwards this key from env.yaml to the tool
    secrets: {}                # Real tools map {ENV_VAR: secret-name-from-profile.yaml}
    egress: []                 # Real tools list allowed external host:port endpoints
    input: {type: object, properties: {}, additionalProperties: false}
  - id: delete
    class: irreversible        # Irreversible tools require human approval on every call
    scopes: [calendar.delete]
    secrets: {}
    egress: []
    input:
      type: object
      required: [event]
      properties: {event: {type: string}}
      additionalProperties: false
