version: 1
triggers:
  # Weekday morning team digest sent to this folder's agent (main). Requires no approval:
  # principal `service:standup` has the read-only `digest` role and cannot invoke approval-gated tools like delete.
  - id: standup
    "on": {cron: "0 9 * * 1-5"}        # Weekdays 09:00 in profile timezone (Asia/Seoul)
    principal: "service:standup"
    target:
      instruction: "Create the weekday morning team summary. Check today's schedule with agenda, add one line each for carryover items and today's risks, and keep it within three sentences. Read-only: make no changes."
