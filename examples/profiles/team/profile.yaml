# Team profile template: team lead (main) with developer, designer, pm, and ops sub-agents.
# See docs/team-template.md for steps to adapt this profile to your team.
version: 1
id: team                      # Must match the folder name (lowercase, digits, hyphens)
timezone: Asia/Seoul          # IANA timezone used for cron triggers and chat schedules
model: assistant              # Model alias allowed by the host (the built-in demo host allows `assistant` for `team`)
roles:                        # Role -> scope list; scopes authorize tools and built-in capabilities
  lead: [run, calendar.read, calendar.delete, schedule.create, schedule.list, schedule.cancel]
  member: [run, calendar.read, schedule.list]
  digest: [run, calendar.read]    # Read-only service principal for scheduled summaries
members:
  - {identity: "local:team", roles: [lead]}         # Demo CLI account `team` (mapped by host to OS user)
  - {identity: "service:standup", roles: [digest]}  # Cron service principal; non-human, cannot approve actions
  # Add real teammates with Slack identities (register workspace alias `home` on the host and copy user IDs from Slack):
  # - {identity: "slack:home/<alice-user-id>", roles: [lead]}
  # - {identity: "slack:home/<bob-user-id>", roles: [member]}
bindings:                     # External entrances -> agent; humans talk only to `main`
  - {id: desk, adapter: cli, account: team, agent: main}
  # To connect a Slack channel (register workspace and channel aliases on the host first):
  # - {id: channel, adapter: slack, workspace: home, channel: team, agent: main}
secrets: []                   # Secret names only; actual values live in the host secret store (e.g. secrets: [tracker-reader])
policy:
  scopes: [run, calendar.read, calendar.delete, schedule.create, schedule.list, schedule.cancel]  # Profile-wide ceiling
  agents:                     # Per-agent ceilings; omitted agents inherit their parent's ceiling
    main/developer: [run]
    main/designer: [run]
    main/pm: [run, calendar.read, schedule.create, schedule.list, schedule.cancel]
    main/ops: [run, calendar.read, calendar.delete]
  approve: []                 # Write scopes requiring approval; `irreversible` tools always require approval regardless
