# 팀 프로필 템플릿 — 팀 리드(main) 아래에 개발·디자인·기획·운영 에이전트를 둔 프로필 하나.
# 복사해서 내 팀으로 바꾸는 순서는 docs/team-template.md에 있다.
version: 1
id: team                      # 폴더 이름과 같아야 한다(소문자·숫자·하이픈)
timezone: Asia/Seoul          # IANA 시간대. cron과 예약은 이 시간대로 읽는다
model: assistant              # 호스트가 이 프로필에 허용한 모델 별칭(내장 데모 호스트는 team에 assistant를 허용한다)
roles:                        # 역할 = 스코프 묶음. 스코프는 도구와 내장 기능이 요구하는 권한 이름이다
  lead: [run, calendar.read, calendar.delete, schedule.create, schedule.list, schedule.cancel]
  member: [run, calendar.read, schedule.list]
  digest: [run, calendar.read]    # 예약 요약 전용 서비스 주체: 읽기만 한다
members:
  - {identity: "local:team", roles: [lead]}         # 데모용 CLI 계정 team(호스트가 OS 사용자에 연결한다)
  - {identity: "service:standup", roles: [digest]}  # cron이 쓰는 서비스 주체. 사람이 아니라서 승인할 수 없다
  # 실제 팀원은 Slack 신원으로 더한다. 워크스페이스 별칭(home)은 호스트에 등록하고, 사용자 ID는 Slack 프로필에서 복사해 쓴다:
  # - {identity: "slack:home/<alice의 사용자 ID>", roles: [lead]}
  # - {identity: "slack:home/<bob의 사용자 ID>", roles: [member]}
bindings:                     # 외부 입구 → 에이전트. 사람은 main에게만 말을 건다
  - {id: desk, adapter: cli, account: team, agent: main}
  # Slack 채널을 연결하려면(호스트에 workspace·channel 별칭을 등록해야 한다):
  # - {id: channel, adapter: slack, workspace: home, channel: team, agent: main}
secrets: []                   # 도구가 쓰는 자격의 '이름'만 적는다. 값은 호스트 보관소에 둔다. 예: secrets: [tracker-reader]
policy:
  scopes: [run, calendar.read, calendar.delete, schedule.create, schedule.list, schedule.cancel]  # 전체 상한
  agents:                     # 에이전트별 추가 상한. 적지 않은 에이전트는 부모의 상한을 이어받는다
    main/developer: [run]
    main/designer: [run]
    main/pm: [run, calendar.read, schedule.create, schedule.list, schedule.cancel]
    main/ops: [run, calendar.read, calendar.delete]
  approve: []                 # 승인이 필요한 write 스코프. irreversible 도구는 여기에 없어도 항상 승인받는다
